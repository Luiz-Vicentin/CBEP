<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Linha do tempo | CBEP</title>
<link href="../CSS/style.css" rel="stylesheet"/>
<script defer="" src="../JavaScript/script.js">
</script>
<script defer="" src="../JavaScript/catalogo.js">
</script>
<script defer="True" src="../JavaScript/linha-do-tempo.js"></script></head>
<body>
<header class="cabecalho">
<div class="marca">
<a class="sigla" href="../index.html">
     CBEP
    </a>
<span class="marca-descricao">
     Catálogo bibliográfico de
     <br/>
     escritores paranaenses
    </span>
</div>
<nav aria-label="Navegação principal" class="navegacao">
<a href="../index.html">
     Início
    </a>
<button aria-controls="painel-lateral" aria-expanded="false" data-menu="autores" type="button">
     Autores
    </button>
<button aria-controls="painel-lateral" aria-expanded="false" data-menu="obras" type="button">
     Obras
    </button>
<a href="mapa.html">
     Mapa
    </a>
<a aria-current="page" href="linha-do-tempo.html">Linha do tempo</a>
<a href="sobre.html">
     Sobre
    </a>
</nav>
</header>
<div class="faixa-azul">
</div>
<div class="estrutura" id="estrutura">
<aside aria-label="Catálogo" class="painel-lateral" hidden="" id="painel-lateral">
<div class="painel-topo">
<h2 id="titulo-painel">
      Autores
     </h2>
<button aria-label="Recolher menu lateral" id="fechar-painel" title="Recolher menu" type="button">
      ❮
     </button>
</div>
<label class="sr-only" for="pesquisa">
     Pesquisar no catálogo
    </label>
<input autocomplete="off" id="pesquisa" placeholder="Pesquisar autor..." type="search"/>
<nav aria-label="Resultados do catálogo">
<ul id="lista-catalogo">
</ul>
</nav>
<p hidden="" id="sem-resultados">
     Nenhum resultado encontrado.
    </p>
</aside>
<main class="conteudo" id="conteudo"><h1>Linha do tempo</h1>
<section aria-label="Linha do tempo da literatura paranaense" class="cbep-timeline">
<div aria-label="Selecione um ano" class="timeline-dates" role="tablist"></div>
<div class="timeline-stage">
<button class="timeline-arrow" aria-label="Evento anterior" id="timeline-prev" type="button" title="Anterior">&#8592;</button>
<div aria-live="polite" class="timeline-panel" id="timeline-painel" role="tabpanel" tabindex="0"></div>
<button class="timeline-arrow" aria-label="Próximo evento" id="timeline-next" type="button" title="Próximo">&#8594;</button>
</div>

</section></main>
</div>
<footer class="rodape">
<div class="rodape-marca">
<strong>
     CBEP
    </strong>
<small>
     Catálogo bibliográfico de escritores paranaenses
     <br/>
     2026
    </small>
</div>
<a class="contato" href="https://docs.google.com/forms/d/e/1FAIpQLSdd1gX3RLJQvGTrSzDLbFLiX2kR7PA3aKx731pIQG-7ZLPJAg/viewform" target="_blank" rel="noopener noreferrer">Envie seu feedback</a>
</footer>
</body>
</html>
